<!DOCTYPE html><html lang="ru"><head>  <meta charset="UTF-8" />  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>  <title>Кармическая ошибка</title>  <style>    *{      margin:0;      padding:0;      box-sizing:border-box;      font-family: Arial, sans-serif;    }    body{      background:#12091f;      color:#fff;      min-height:100vh;      display:flex;      justify-content:center;      align-items:center;      padding:20px;    }    .card{      width:100%;      max-width:460px;      background:#1d102d;      border-radius:24px;      padding:30px 24px;      border:1px solid rgba(255,215,0,0.2);      box-shadow:0 0 30px rgba(0,0,0,0.4);    }    h1{      text-align:center;      color:#ffd700;      margin-bottom:10px;      font-size:30px;    }    .subtitle{      text-align:center;      color:#cdb8ec;      font-size:14px;      line-height:1.5;      margin-bottom:30px;    }    .input-group{      margin-bottom:18px;    }    label{      display:block;      margin-bottom:8px;      color:#f0e6ff;      font-size:14px;    }    input{      width:100%;      padding:14px;      border:none;      border-radius:14px;      background:#2a173f;      color:#fff;      font-size:16px;      outline:none;    }    input:focus{      border:1px solid #ffd700;    }    button{      width:100%;      padding:16px;      border:none;      border-radius:16px;      background:#ffd700;      color:#1d102d;      font-size:16px;      font-weight:bold;      cursor:pointer;      transition:0.3s;      margin-top:10px;    }    button:hover{      transform:translateY(-2px);      opacity:0.95;    }    .result{      margin-top:30px;      background:#2a173f;      border-radius:20px;      padding:24px;      display:none;    }    .result-title{      text-align:center;      color:#ffd700;      font-size:24px;      margin-bottom:18px;    }    .arcane{      font-size:22px;      font-weight:bold;      text-align:center;      margin-bottom:20px;      line-height:1.4;    }    .text{      color:#eadfff;      line-height:1.7;      font-size:15px;    }  </style></head><body><div class="card">  <h1>Кармическая ошибка</h1>  <div class="subtitle">    Расчёт ошибки прошлого воплощения<br>    по дате рождения  </div>  <div class="input-group">    <label>День рождения</label>    <input type="number" id="day" placeholder="Например: 26">  </div>  <div class="input-group">    <label>Месяц рождения</label>    <input type="number" id="month" placeholder="Например: 9">  </div>  <button onclick="calculate()">    Рассчитать  </button>  <div class="result" id="result">    <div class="result-title">      Ваш результат    </div>    <div class="arcane" id="arcane"></div>    <div class="text" id="text"></div>  </div></div><script>function reduce22(num){  while(num > 22){    num -= 22;  }  return num;}const meanings = {  1:{ name:"Маг", text:"В прошлом воплощении человек мог злоупотреблять силой, властью и влиянием." },  2:{ name:"Жрица", text:"В прошлом воплощении была закрытость, эмоциональный холод и недоверие к людям." },  3:{ name:"Императрица", text:"Прошлая жизнь могла проходить в погоне за удовольствиями и комфортом." },  4:{ name:"Император", text:"В прошлом воплощении человек мог быть слишком жёстким и контролирующим." },  5:{ name:"Иерофант", text:"В прошлом воплощении человек мог осуждать других и навязывать свою правду." },  6:{ name:"Влюблённые", text:"Прошлая жизнь могла быть связана с зависимыми отношениями и страхом выбора." },  7:{ name:"Колесница", text:"В прошлом воплощении было много борьбы, агрессии и желания побеждать любой ценой." },  8:{ name:"Справедливость", text:"Прошлая жизнь могла оставить карму несправедливости, обид и долгов." },  9:{ name:"Отшельник", text:"В прошлом воплощении человек мог отказаться от людей и закрыться от мира." },  10:{ name:"Колесо Фортуны", text:"Прошлая жизнь связана с повторяющимися сценариями и цикличностью." },  11:{ name:"Сила", text:"В прошлом воплощении человек мог подавлять других силой характера." },  12:{ name:"Повешенный", text:"Прошлая жизнь связана с жертвенностью и отказом от собственной ценности." },  13:{ name:"Смерть", text:"В прошлом воплощении был страх перемен и болезненное удержание прошлого." },  14:{ name:"Умеренность", text:"Прошлая жизнь могла проходить в крайностях и эмоциональных качелях." },  15:{ name:"Дьявол", text:"Прошлая жизнь оставила карму зависимостей, искушений и манипуляций." },  16:{ name:"Башня", text:"В прошлом воплощении человек мог жить через гордыню и разрушение." },  17:{ name:"Звезда", text:"Прошлая жизнь связана с иллюзиями и ожиданием идеальной жизни." },  18:{ name:"Луна", text:"В прошлом воплощении было много страхов, тревожности и самообмана." },  19:{ name:"Солнце", text:"Прошлая жизнь могла быть связана с эгоцентризмом и гордыней." },  20:{ name:"Суд", text:"Прошлая жизнь оставила тяжёлые родовые сценарии и чувство вины." },  21:{ name:"Мир", text:"В прошлом воплощении человек мог не завершать важные процессы." },  22:{ name:"Шут", text:"Прошлая жизнь связана с хаосом и избеганием ответственности." }};function calculate(){  const dayBirth = Number(document.getElementById('day').value);  const monthBirth = Number(document.getElementById('month').value);  if(!dayBirth || !monthBirth){    alert('Введите день и месяц рождения');    return;  }  const day = reduce22(dayBirth);  const month = reduce22(monthBirth);  let karmic;  if(day > month){    karmic = day - month;  } else {    karmic = month - day;  }  if(karmic === 0){    karmic = 22;  }  const result = meanings[karmic];  document.getElementById('result').style.display = 'block';  document.getElementById('arcane').innerHTML = `    Кармическая ошибка — ${karmic} Аркан<br>    (${result.name})  `;  document.getElementById('text').innerText = result.text;}</script></body></html>
