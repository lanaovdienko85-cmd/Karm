<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Кармическая ошибка</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      min-height:100vh;
      background:
      radial-gradient(circle at top, #3b1361 0%, #12091f 55%, #09040f 100%);
      color:#fff;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:480px;
      background:rgba(29,16,45,0.92);
      border:1px solid rgba(255,215,0,0.25);
      border-radius:28px;
      padding:34px 26px;
      backdrop-filter:blur(12px);
      box-shadow:
      0 0 40px rgba(0,0,0,0.45),
      0 0 20px rgba(255,215,0,0.08);
    }

    h1{
      text-align:center;
      color:#ffd700;
      font-size:34px;
      margin-bottom:12px;
      letter-spacing:1px;
    }

    .subtitle{
      text-align:center;
      color:#d8c6f3;
      font-size:15px;
      line-height:1.6;
      margin-bottom:32px;
    }

    .input-group{
      margin-bottom:20px;
    }

    label{
      display:block;
      margin-bottom:8px;
      color:#f4eaff;
      font-size:14px;
    }

    input{
      width:100%;
      padding:16px;
      border:none;
      border-radius:16px;
      background:#2d1845;
      color:#fff;
      font-size:16px;
      outline:none;
      transition:0.3s;
    }

    input:focus{
      border:1px solid #ffd700;
      box-shadow:0 0 12px rgba(255,215,0,0.25);
    }

    button{
      width:100%;
      padding:18px;
      border:none;
      border-radius:18px;
      background:linear-gradient(135deg,#ffd700,#ffb700);
      color:#1d102d;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
      margin-top:8px;
    }

    button:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 18px rgba(255,215,0,0.25);
    }

    .result{
      margin-top:32px;
      background:rgba(50,25,75,0.7);
      border:1px solid rgba(255,215,0,0.12);
      border-radius:24px;
      padding:26px;
      display:none;
    }

    .result-title{
      text-align:center;
      color:#ffd700;
      font-size:26px;
      margin-bottom:18px;
    }

    .arcane{
      text-align:center;
      font-size:24px;
      font-weight:bold;
      color:#fff;
      margin-bottom:20px;
      line-height:1.5;
    }

    .text{
      color:#f0e6ff;
      line-height:1.8;
      font-size:15px;
      text-align:center;
    }

    .moon{
      text-align:center;
      font-size:34px;
      margin-bottom:14px;
    }

  </style>
</head>

<body>

<div class="card">

  <div class="moon">🌙</div>

  <h1>Кармическая ошибка</h1>

  <div class="subtitle">
    Расчёт ошибки прошлого воплощения<br>
    по дате рождения
  </div>

  <div class="input-group">
    <label>День рождения</label>
    <input type="number" id="day" placeholder="Например: 26">
  </div>

  <div class="input-group">
    <label>Месяц рождения</label>
    <input type="number" id="month" placeholder="Например: 9">
  </div>

  <button onclick="calculate()">
    Рассчитать
  </button>

  <div class="result" id="result">

    <div class="result-title">
      Ваш результат
    </div>

    <div class="arcane" id="arcane"></div>

    <div class="text" id="text"></div>

  </div>

</div>

<script>

function reduce22(num){
  while(num > 22){
    num -= 22;
  }
  return num;
}

const meanings = {

  1:{ name:"Маг", text:"В прошлом воплощении человек мог злоупотреблять силой, властью и влиянием." },

  2:{ name:"Жрица", text:"В прошлом воплощении была закрытость, эмоциональный холод и недоверие к людям." },

  3:{ name:"Императрица", text:"Прошлая жизнь могла проходить в погоне за удовольствиями и комфортом." },

  4:{ name:"Император", text:"В прошлом воплощении человек мог быть слишком жёстким и контролирующим." },

  5:{ name:"Иерофант", text:"В прошлом воплощении человек мог осуждать других и навязывать свою правду." },

  6:{ name:"Влюблённые", text:"Прошлая жизнь могла быть связана с зависимыми отношениями и страхом выбора." },

  7:{ name:"Колесница", text:"В прошлом воплощении было много борьбы, агрессии и желания побеждать любой ценой." },

  8:{ name:"Справедливость", text:"Прошлая жизнь могла оставить карму несправедливости, обид и долгов." },

  9:{ name:"Отшельник", text:"В прошлом воплощении человек мог отказаться от людей и закрыться от мира." },

  10:{ name:"Колесо Фортуны", text:"Прошлая жизнь связана с повторяющимися сценариями и цикличностью." },

  11:{ name:"Сила", text:"В прошлом воплощении человек мог подавлять других силой характера." },

  12:{ name:"Повешенный", text:"Прошлая жизнь связана с жертвенностью и отказом от собственной ценности." },

  13:{ name:"Смерть", text:"В прошлом воплощении был страх перемен и болезненное удержание прошлого." },

  14:{ name:"Умеренность", text:"Прошлая жизнь могла проходить в крайностях и эмоциональных качелях." },

  15:{ name:"Дьявол", text:"Прошлая жизнь оставила карму зависимостей, искушений и манипуляций." },

  16:{ name:"Башня", text:"В прошлом воплощении человек мог жить через гордыню и разрушение." },

  17:{ name:"Звезда", text:"Прошлая жизнь связана с иллюзиями и ожиданием идеальной жизни." },

  18:{ name:"Луна", text:"В прошлом воплощении было много страхов, тревожности и самообмана." },

  19:{ name:"Солнце", text:"Прошлая жизнь могла быть связана с эгоцентризмом и гордыней." },

  20:{ name:"Суд", text:"Прошлая жизнь оставила тяжёлые родовые сценарии и чувство вины." },

  21:{ name:"Мир", text:"В прошлом воплощении человек мог не завершать важные процессы." },

  22:{ name:"Шут", text:"Прошлая жизнь связана с хаосом и избеганием ответственности." }

};

function calculate(){

  const dayBirth = Number(document.getElementById('day').value);
  const monthBirth = Number(document.getElementById('month').value);

  if(!dayBirth || !monthBirth){
    alert('Введите день и месяц рождения');
    return;
  }

  const day = reduce22(dayBirth);
  const month = reduce22(monthBirth);

  let karmic;

  if(day > month){
    karmic = day - month;
  } else {
    karmic = month - day;
  }

  if(karmic === 0){
    karmic = 22;
  }

  const result = meanings[karmic];

  document.getElementById('result').style.display = 'block';

  document.getElementById('arcane').innerHTML = `
    ${karmic} Аркан — ${result.name}
  `;

  document.getElementById('text').innerText = result.text;
}

</script>

</body>
  </html>
